name: Version Check

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/js/package.json"

jobs:
  check-version:
    name: Check Version Bump
    runs-on: ubuntu-latest
    # Skip this check for the automated "Version Packages" PR
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check if version was bumped
        run: |
          # Read versions directly from git objects — no working-tree changes needed,
          # and works correctly in detached HEAD (PR merge ref) state.
          PR_VERSION=$(git show HEAD:packages/js/package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          MAIN_VERSION=$(git show origin/main:packages/js/package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")

          echo "Main branch version: $MAIN_VERSION"
          echo "PR branch version: $PR_VERSION"

          if [ "$PR_VERSION" == "$MAIN_VERSION" ]; then
            echo "⚠️ Warning: Version in package.json was not bumped!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Current version: \`$PR_VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This is expected if you're using changesets. The version will be bumped automatically in the 'Version Packages' PR." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Did you create a changeset? Run: \`pnpm changeset\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Version bumped from $MAIN_VERSION to $PR_VERSION" >> $GITHUB_STEP_SUMMARY
          fi
