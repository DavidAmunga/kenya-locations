name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Detect which packages changed ─────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.filter.outputs.data }}
      js: ${{ steps.filter.outputs.js }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            data:
              - 'data/**'
            js:
              - 'packages/js/**'
              - 'data/**'
            kotlin:
              - 'packages/kotlin/**'
              - 'data/**'

  # ── Validate shared data ───────────────────────────────────────────────────
  validate-data:
    name: Validate shared JSON data
    needs: changes
    if: needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-data.js

  # ── JS package ────────────────────────────────────────────────────────────
  ci-js:
    name: JS — Lint, Build & Test
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: js-dist
          path: packages/js/dist/
          retention-days: 7

  # ── Kotlin package ────────────────────────────────────────────────────────
  ci-kotlin:
    name: Kotlin — Build & Test
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Copy data files
        run: ./gradlew copyLocationData
      - name: Build
        run: ./gradlew assembleRelease
      - name: Test
        run: ./gradlew test
