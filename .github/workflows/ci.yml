name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Detect which packages changed ─────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.filter.outputs.data }}
      js: ${{ steps.filter.outputs.js }}
      react: ${{ steps.filter.outputs.react }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
      swift: ${{ steps.filter.outputs.swift }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            data:
              - 'data/**'
            js:
              - 'packages/js/**'
              - 'data/**'
            react:
              - 'packages/react/**'
              - 'packages/js/**'
            kotlin:
              - 'packages/kotlin/**'
              - 'data/**'
            swift:
              - 'packages/swift/**'
              - 'data/**'
            web:
              - 'apps/web/**'
              - 'packages/js/**'
              - 'data/**'

  # ── Validate shared data ───────────────────────────────────────────────────
  validate-data:
    name: Validate shared JSON data
    needs: changes
    if: needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-data.js

  # ── JS package ────────────────────────────────────────────────────────────
  ci-js:
    name: JS — Lint, Build & Test
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: js-dist
          path: packages/js/dist/
          retention-days: 7

  # ── React package ─────────────────────────────────────────────────────────
  ci-react:
    name: React — Lint, Build & Test
    needs: changes
    if: needs.changes.outputs.react == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build kenya-locations (required for type resolution)
        run: pnpm build
        working-directory: packages/js
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  # ── Kotlin package ────────────────────────────────────────────────────────
  ci-kotlin:
    name: Kotlin — Build & Test
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Copy data files
        run: ./gradlew copyLocationData
      - name: Build
        run: ./gradlew build
      - name: Test
        run: ./gradlew test

  # ── Web demo ──────────────────────────────────────────────────────────────
  ci-web:
    name: Web — Build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kenya-locations-web build

  # ── Swift package ─────────────────────────────────────────────────────────
  ci-swift:
    name: Swift — Build & Test
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy data files into Resources
        run: mkdir -p packages/swift/Sources/KenyaLocations/Resources && cp data/*.json packages/swift/Sources/KenyaLocations/Resources/
      - name: Build (root Package.swift — validates SPM install URL)
        run: swift build -c release
      - name: Test (packages/swift Package.swift)
        run: swift test
        working-directory: packages/swift
