# Preview channel for PRs that change the website or the data it displays.
name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/js/**"
      - "data/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/firebase-hosting-pull-request.yml"

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kenya-locations build
      - run: pnpm --filter kenya-locations-web build
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KENYA_LOCATIONS }}
          projectId: kenya-locations
          entryPoint: apps/web
