name: Publish Kotlin to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.5.0) — must match gradle.properties VERSION_NAME"
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Build & Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/kotlin

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate shared data
        run: node scripts/validate-data.js
        working-directory: ${{ github.workspace }}

      - name: Copy data files into res/raw
        run: ./gradlew copyLocationData

      - name: Build JAR
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Publish and release to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}

      - name: Tag release
        run: |
          TAG="android/v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "android v${{ inputs.version }}"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "android v${{ inputs.version }}" \
            --notes "### Installation
          \`\`\`kotlin
          implementation(\"io.github.davidamunga:kenya-locations:${{ inputs.version }}\")
          \`\`\`
          [View on Maven Central](https://central.sonatype.com/artifact/io.github.davidamunga/kenya-locations/${{ inputs.version }})" \
            || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Published io.github.davidamunga:kenya-locations:${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`kotlin" >> $GITHUB_STEP_SUMMARY
          echo "implementation(\"io.github.davidamunga:kenya-locations:${{ inputs.version }}\")" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [Maven Central](https://central.sonatype.com/artifact/io.github.davidamunga/kenya-locations/${{ inputs.version }})" >> $GITHUB_STEP_SUMMARY
